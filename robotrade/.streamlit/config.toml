# ロボトレード ダッシュボードの見た目（SPEC 12）。
# 🔴 ライト/ダークの2テーマを定義する。base を書かないと**ブラウザ/OSのモードに追従**する。
#    色は両モードで可読な濃度に振り分ける（固定の黒/白にしない）。
# 🔵 配色は最小限。buy=緑 / sell=赤 / hold=グレー 程度に絞る（装飾より一覧性）。

[server]
headless = true
port = 8501
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[theme]
font = "sans-serif"
baseRadius = "small"

[theme.light]
primaryColor = "#2a78d6"            # 検証済みパレットの青（light）
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f1ee"
textColor = "#0b0b0b"
linkColor = "#2a78d6"
greenColor = "#1baf7a"              # buy
redColor = "#e34948"                # sell
grayColor = "#52514e"               # hold
borderColor = "#dcdcd6"

[theme.dark]
primaryColor = "#3987e5"            # 同じ8色を dark 面に合わせて踏み直したもの
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#24241f"
textColor = "#ffffff"
linkColor = "#3987e5"
greenColor = "#199e70"
redColor = "#e66767"
grayColor = "#c3c2b7"
borderColor = "#3a3a35"
