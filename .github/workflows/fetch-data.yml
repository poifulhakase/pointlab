name: データ自動更新

on:
  schedule:
    # 各実行は fetch-jpx.mjs が全データソースを一括取得する（前営業日分を翌営業日に最新化）。
    # 鮮度方針：平日は毎日2回走らせ、前営業日分を確実に取得＋Yahoo等の一時的な欠損(穴)を再取得で補完。
    #   月曜の実行で金曜分（JPXは翌営業日=月曜公表）も拾えるため、旧スケジュールの「金曜分が火曜まで来ない」穴を解消。
    # 月〜金 19:30 JST (10:30 UTC): JPX日報(前営業日分・公表16:31〜17:00)の後に取得
    - cron: '30 10 * * 1-5'
    # 月〜金 21:30 JST (12:30 UTC): 保険。1回目がGitHub側で遅延/スキップされた場合や、
    #   Yahoo等の遅れて埋まる欠損を再取得（変更が無ければコミットしないので無害）
    - cron: '30 12 * * 1-5'
    # 土曜 09:00 JST (00:00 UTC): 週次COT（CFTC金曜20:30UTC公表後）・週次集計・バックテスト再計算・更新通知
    - cron: '0 0 * * 6'
    # 🔴 月〜金 08:30 JST (前日23:30 UTC): **ロボ口座の判断**（2026-08-10 に 19:30 から移動）。
    #    使う材料（前営業日の終値）も執行タイミング（寄り付き）も変わらないが、
    #    **通知を読んでから執行するまでの間隔が短いほうが、読み落としも気変わりも減る**。
    #    UTCでは日曜〜木曜なので `0-4`。JSTの月〜金にあたる。
    - cron: '30 23 * * 0-4'
  workflow_dispatch:
    inputs:
      robo_dry:
        description: 'ロボ口座の判断を空撃ちする（--dry：口座もログも書かず、Chatwork へも送らない。鍵の配線確認用）'
        type: boolean
        default: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係インストール
        run: npm ci

      - name: データ取得
        run: npm run fetch-data
        continue-on-error: true

      - name: バックテスト再計算（土曜のみ）
        if: github.event_name == 'schedule' && contains(github.event.schedule, '0 0 * * 6')
        run: npm run backtest
        continue-on-error: true

      # ロボ口座（疑似トレード）の判断。
      # 🔴 **平日08:30 JST の回だけ動かす**（2026-08-10 に 19:30 から移動）。
      #    19:30 と 21:30 はデータ取得の回で、ここで判断すると同じ材料で2回判断してしまう
      #    （1日1回・設計書 §2 論点1）。
      # 🔴 **記録される日付が1日ずれた**（前日夜に判断 → 当日朝に判断）。
      #    材料は前営業日の終値のままなので中身は変わらないが、成績を日付で追うときは
      #    2026-08-10 を境に基準が変わっていることに注意する。
      #    🔵 本番のトレードが1件も無いうちに変えたので、過去の記録は混ざっていない。
      # 🔴 continue-on-error: 判断が失敗してもデータ更新とコミットは止めない。
      # 🔵 手動実行で robo_dry にチェックを入れたときだけ、--dry の空撃ちとして走らせる
      #    （Secrets が Actions 上で通るかの確認用。休場日でも見たいので --force を付ける）。
      - name: ロボ口座の判断（平日08:30のみ／手動は空撃ち）
        if: (github.event_name == 'schedule' && contains(github.event.schedule, '30 23 * * 0-4')) || inputs.robo_dry
        run: |
          if [ "${{ inputs.robo_dry }}" = "true" ]; then
            npm run robo-trade -- --dry --force
          else
            npm run robo-trade
          fi
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}

      - name: 変更チェック & コミット
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # フレッシュデータを一時退避
          cp -r public/data/ /tmp/fresh_data

          # リモート最新に強制同期（コンフリクト根絶）
          git fetch origin main
          git reset --hard origin/main

          # フレッシュデータを上書き
          cp -r /tmp/fresh_data/. public/data/

          git add public/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "データに変更なし。スキップします。"
          else
            git commit -m "chore: データ自動更新 $(date '+%Y-%m-%d')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 本番デプロイは Vercel の GitHub 連携が main への push をトリガーに自動実行する。
      # （以前はここで明示的に `vercel --prod` を実行していたが、Git連携と二重になり
      #  かつ失敗時に本番へ届かない原因になっていたため撤去。コミットに [skip ci] を
      #  付けないこと＝付けると Vercel 連携デプロイもスキップされる。）

      # 🔴 全データファイルの鮮度を見る（2026-07-31 に拡張）。
      #    それまでは futures_daily と investor の**2ファイルだけ**を見ていたため、
      #    topix.json が 7/13 から2週間止まっていても誰にも通知されなかった。
      #    許容日数と公表サイクルは scripts/check-freshness.mjs に集約してある
      #    （ローカルでも `npm run check-freshness` で同じ判定ができる）。
      - name: データ鮮度チェック
        id: freshness_check
        if: always()
        run: npm run check-freshness
        continue-on-error: true

      - name: データ鮮度チェック失敗通知
        if: always() && steps.freshness_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: '⚠️ データ鮮度チェック失敗 ' + new Date().toISOString().slice(0, 10),
              body:  'データ鮮度チェックで古いデータを検出しました。\n\nワークフロー: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['data-stale'],
            });

      - name: データ更新通知を送信（土曜のみ・成功時）
        if: success() && github.event_name == 'schedule' && contains(github.event.schedule, '0 0 * * 6')
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST https://pointlab.vercel.app/api/notify-data-ready \
            -H "x-notify-secret: ${{ secrets.NOTIFY_SECRET }}"
